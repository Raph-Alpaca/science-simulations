name: Studio same-byte approved publication
on:
  workflow_call:
    inputs:
      publication_id:
        required: true
        type: string
      artifact_hash:
        required: true
        type: string
    secrets:
      STUDIO_TRANSFER_KEY:
        required: true
permissions: {}
jobs:
  deploy:
    if: github.repository == 'Raph-Alpaca/science-simulations' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && vars.STUDIO_PUBLICATION_ENABLED == 'true' && vars.STUDIO_PUBLICATION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://raph-alpaca.github.io/science-simulations/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-publication-${{ inputs.publication_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-publication-report-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-publication-${{ inputs.publication_id }}
      - name: Consume current teacher approval before public upload
        id: claim
        env:
          STUDIO_PUBLICATION_ID: ${{ inputs.publication_id }}
          STUDIO_ARTIFACT_HASH: ${{ inputs.artifact_hash }}
          STUDIO_TRANSFER_KEY: ${{ secrets.STUDIO_TRANSFER_KEY }}
        run: node automation/publish/claim-cli.mjs
      - name: Upload the same approved bytes without rebuilding
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: studio-pages-${{ github.run_id }}
          path: ${{ steps.claim.outputs.artifact_path }}
          retention-days: 1
      - name: Create once and verify public bytes
        env:
          STUDIO_PUBLICATION_ID: ${{ inputs.publication_id }}
          STUDIO_ARTIFACT_HASH: ${{ inputs.artifact_hash }}
          STUDIO_TRANSFER_KEY: ${{ secrets.STUDIO_TRANSFER_KEY }}
          STUDIO_PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node automation/publish/deploy-cli.mjs
      - name: Record measured completion or uncertainty once
        env:
          STUDIO_PUBLICATION_ID: ${{ inputs.publication_id }}
          STUDIO_ARTIFACT_HASH: ${{ inputs.artifact_hash }}
          STUDIO_TRANSFER_KEY: ${{ secrets.STUDIO_TRANSFER_KEY }}
        run: node automation/publish/complete-cli.mjs
