name: Studio publication synthetic Linux check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: studio-publication-rehearsal
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'Raph-Alpaca/science-simulations' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: image
        run: node automation/runner/container/build.mjs
      - name: Check synthetic 2D, 3D and negative cases once
        env:
          STUDIO_CHECKER_IMAGE: ${{ steps.image.outputs.image }}
        run: node tests/studio/publication-container-check.mjs
